name: CI

# Standard GitHub-hosted runners only, with no secrets: signed releases stay local.
# Details and limits: docs/CI.md.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) range="" ;;
          esac
          # Anything unclear (manual run, new or rewritten history, no files) runs everything.
          code=true
          if [ -n "$range" ] && files=$(git diff --name-only "$range") && [ -n "$files" ]; then
            if ! printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Build every platform: $code"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Python (pyflakes rules and syntax errors)
        run: pipx run ruff==0.17.4 check --isolated --select F,E9 --output-format github .
      - name: C (warnings as errors)
        run: |
          cmake -S . -B build/lint -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror
          cmake --build build/lint --parallel

  linux:
    name: Linux (Python ${{ matrix.python }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']  # the oldest supported, and a current one
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build, full test suite, UDP smoke test, ASan and UBSan corruption inputs
        run: python tools/test_posix.py
      - name: Report tests
        if: always() && hashFiles('dist/posix-test-report.json') != ''
        run: python tools/ci_report.py dist/posix-test-report.json

  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # The release source checks compare exact bytes, so keep the committed LF line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11.0'  # the audited packaging runtime: tools/legal_assets.py
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-build.txt ninja==1.13.0
      - name: Point the local build tools at this runner
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .local-tools -Force | Out-Null
          @{ javaHome = $env:JAVA_HOME } | ConvertTo-Json | Set-Content .local-tools\android-environment.json
          & .\tools\Build-Windows.ps1 -SkipControlTool -Python (Get-Command python).Source -CMake (Get-Command cmake).Source -Ninja (Get-Command ninja).Source
      - name: Build, full test suite, packaged tool smoke tests, ASan corruption inputs
        shell: powershell
        run: .\tools\Test-Local.ps1
      - name: Report tests
        if: always() && hashFiles('dist/test-report.json') != ''
        run: python tools/ci_report.py dist/test-report.json

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build, full test suite, UDP smoke test, ASan and UBSan corruption inputs
        run: python tools/test_posix.py
      - name: Report tests
        if: always() && hashFiles('dist/posix-test-report.json') != ''
        run: python tools/ci_report.py dist/posix-test-report.json

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_VERSION: 8.10.2
      GRADLE_SHA256: 31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26
      ORG_JSON_SHA256: 3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle.kts
      - run: python -m pip install -r requirements-dev.txt
      - name: Install the pinned Android tools
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null  # yes dies on a closed pipe
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1' > /dev/null
          curl -fsSLo "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - name: Build the unsigned release APK
        run: '"$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin/gradle" --no-daemon --console=plain --project-dir android assembleRelease'
      - name: Check the APK identity and JNI exports in every ABI
        run: |
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$apk" | grep -q "^package: name='io.github.tehcnological.sentrybridge'"
          readelf="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          expected=$(grep -oE 'external fun [A-Za-z0-9]+' android/app/src/main/java/io/github/tehcnological/sentrybridge/SbCore.kt | awk '{print $3}' | sort -u)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -p "$apk" "lib/$abi/libsbjni.so" > "$RUNNER_TEMP/$abi.so"
            actual=$("$readelf" -Ws --dyn-syms "$RUNNER_TEMP/$abi.so" | grep -oE 'Java_io_github_tehcnological_sentrybridge_SbCore_[A-Za-z0-9]+' | sed 's/.*SbCore_//' | sort -u)
            if [ "$actual" != "$expected" ]; then echo "::error title=APK::JNI exports differ from Kotlin for $abi"; exit 1; fi
          done
      - name: Kotlin capture tools against the Python reference
        run: |
          mkdir -p .local-tools/test-deps
          curl -fsSLo .local-tools/test-deps/json-20240303.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          echo "$ORG_JSON_SHA256  .local-tools/test-deps/json-20240303.jar" | sha256sum -c -
          printf '{"javaHome":"%s","gradleUserHome":"%s","sdkRoot":"%s"}' "$JAVA_HOME" "$HOME/.gradle" "$ANDROID_HOME" > .local-tools/android-environment.json
          python tools/test_android_diagnostics.py

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27  # the app needs the iOS 27 SDK; macos-latest stops at Xcode 26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Generated Xcode project is current
        run: |
          python tools/generate_ios_project.py
          git diff --exit-code -- ios
      - name: Build the release and Lite IPAs, unsigned
        run: |
          python tools/build_ios_ipa.py
          python tools/build_ios_ipa.py --flavor Lite
      - name: POSIX adapter over local UDP
        run: python -m unittest discover -s ios/tests -p 'test_*.py' -v
      - name: Swift worker on the host
        run: python tools/validate_ios_host.py
      - name: UI tests on the simulator
        run: |
          # Boot first: a cold simulator can miss the test runner's accessibility deadline.
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 17")][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcodebuild test -project ios/SentryBridge.xcodeproj -scheme SentryBridge -destination "id=$udid" -derivedDataPath build/ios-ui CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= -quiet
      - name: UI test failure messages
        if: failure()
        run: |
          # -quiet names the failing tests only; the result bundle has each failure's message and line.
          result=$(ls -dt build/ios-ui/Logs/Test/*.xcresult | head -1)
          xcrun xcresulttool get test-results summary --path "$result"

  # The one required check. Skipped platforms pass here, so docs-only changes can merge.
  ci:
    name: CI
    needs: [changes, lint, linux, windows, macos, android, ios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            ([.changes, .lint, .linux] | all(.result == "success"))
            and ([.windows, .macos, .android, .ios] | all(.result == "success" or .result == "skipped"))' > /dev/null
